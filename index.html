<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>敲门 KNOCK — 2D/3D 恐怖 Demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; color: #ddd; user-select: none; }
  #stage { position: fixed; inset: 0; background: #000; }
  #c2d, #c3d { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: none; }
  #c2d { object-fit: contain; }
  #grain { position: absolute; inset: -64px; pointer-events: none; opacity: .11; display: none; mix-blend-mode: screen; }
  #vignette { position: absolute; inset: 0; pointer-events: none; display: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.75) 100%); }
  #fade { position: absolute; inset: 0; background: #000; opacity: 1; pointer-events: none; }
  #cross { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%;
    background: rgba(255,255,255,.45); display: none; }

  #obj { position: absolute; left: 20px; top: 18px; max-width: 46%; padding: 8px 14px 9px;
    background: rgba(0,0,0,.55); border-left: 3px solid #c9a227; display: none; }
  #obj small { display: block; font-size: 11px; letter-spacing: 3px; color: #c9a227; }
  #obj b { display: block; font-size: 17px; font-weight: 500; color: #f1ead8; margin-top: 2px; }
  #obj i { display: block; font-size: 12px; font-style: normal; color: #9a9483; margin-top: 3px; }
  #obj.pop { animation: pop .6s ease-out; }
  @keyframes pop { 0% { background: rgba(201,162,39,.55); } 100% { background: rgba(0,0,0,.55); } }

  #prompt { position: absolute; left: 50%; bottom: 27%; transform: translateX(-50%); padding: 5px 14px;
    font-size: 15px; background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.25); border-radius: 3px; display: none; white-space: nowrap; }
  #hold { position: absolute; left: 50%; bottom: 24%; width: 180px; height: 5px; margin-left: -90px;
    background: rgba(255,255,255,.15); display: none; }
  #hold div { height: 100%; width: 0; background: #c9a227; }
  #lockhint { position: absolute; left: 50%; top: 10%; transform: translateX(-50%); font-size: 13px; color: #aaa;
    background: rgba(0,0,0,.6); padding: 4px 12px; display: none; }

  #dlg { position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%); width: min(760px, 86%);
    padding: 16px 22px 20px; background: rgba(0,0,0,.82); border: 1px solid rgba(255,255,255,.18);
    font-size: 19px; line-height: 1.6; display: none; box-sizing: border-box; }
  #dlgWho { font-size: 13px; letter-spacing: 3px; color: #c9a227; margin-bottom: 4px; display: none; }
  #dlg span { position: absolute; right: 12px; bottom: 5px; font-size: 11px; color: #777; }
  #center { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 30px; letter-spacing: 8px; color: #a11; text-shadow: 0 0 18px #400; }

  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #000; text-align: center; }
  .screen h1 { font-size: 64px; letter-spacing: 22px; margin: 0 0 4px 22px; font-weight: 400; color: #e8e2d2; }
  .screen h2 { font-size: 14px; letter-spacing: 6px; font-weight: 400; color: #8a8372; margin: 0 0 40px; }
  .screen p { font-size: 14px; color: #8a8372; line-height: 2; margin: 0 0 30px; }
  .screen kbd { border: 1px solid #555; padding: 1px 7px; border-radius: 3px; color: #ccc; font-family: inherit; }
  .screen button { font: inherit; font-size: 17px; letter-spacing: 4px; color: #e8e2d2; background: none;
    border: 1px solid #6d6657; padding: 10px 34px; cursor: pointer; }
  .screen button:hover { background: #1c1a15; }
  .screen button:disabled { color: #6d6657; cursor: default; background: none; }
  #end { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage">
  <canvas id="c2d" width="320" height="180"></canvas>
  <canvas id="c3d"></canvas>
  <div id="grain"></div>
  <div id="vignette"></div>
  <div id="cross"></div>
  <div id="fade"></div>

  <div id="obj"><small>当前目标</small><b></b><i></i></div>
  <div id="prompt"></div>
  <div id="hold"><div></div></div>
  <div id="lockhint">点击画面以控制视角（或用方向键转头）</div>
  <div id="dlg"><div id="dlgWho"></div><div id="dlgText"></div><span>E / 空格 继续</span></div>
  <div id="center"></div>

  <div id="title" class="screen">
    <h1>敲门</h1>
    <h2>KNOCK · 2D / 3D 恐怖 DEMO</h2>
    <p>
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动　<kbd>Shift</kbd> 奔跑　<kbd>E</kbd> 互动 / 继续对话<br>
      进入 3D 房间后：鼠标转动视角（也可用方向键）<br>
      建议佩戴耳机 · 约 8 分钟 · 含突然惊吓
    </p>
    <button id="startBtn" disabled>加载素材…</button>
  </div>
  <div id="end" class="screen">
    <h1>敲门</h1>
    <h2>DEMO 完 · 感谢游玩</h2>
    <p>「四下的，是鬼。」<br>——那么，刚才敲门的是谁。</p>
    <button id="againBtn">再来一次</button>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
